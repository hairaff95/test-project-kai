<svg width="220" height="160" viewBox="0 0 220 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Cloud / Bubble Shapes -->
  <g opacity="0.9">
    <ellipse cx="110" cy="95" rx="85" ry="42" fill="#BAE6FD" />
    <circle cx="68" cy="82" r="38" fill="#BAE6FD" />
    <circle cx="150" cy="78" r="40" fill="#BAE6FD" />
    <circle cx="108" cy="58" r="38" fill="#E0F2FE" />
  </g>

  <!-- Sparkles & Floating Particles -->
  <circle cx="36" cy="76" r="4" fill="#7DD3FC" opacity="0.8" />
  <circle cx="48" cy="45" r="3" fill="#38BDF8" opacity="0.7" />
  <circle cx="178" cy="52" r="3.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="192" cy="88" r="4.5" fill="#7DD3FC" opacity="0.8" />
  <circle cx="185" cy="112" r="3" fill="#38BDF8" opacity="0.7" />
  
  <!-- Yellow Sparkle Star -->
  <path d="M165 30 C165 35 168 38 173 38 C168 38 165 41 165 46 C165 41 162 38 157 38 C162 38 165 35 165 30 Z" fill="#FBBF24" />

  <!-- White Back Sheet (Rotated Left) -->
  <g transform="translate(88, 38) rotate(-12)">
    <rect x="0" y="0" width="34" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))" />
    <rect x="5" y="8" width="24" height="2.5" rx="1.25" fill="#CBD5E1" />
    <rect x="5" y="14" width="18" height="2.5" rx="1.25" fill="#CBD5E1" />
    <rect x="5" y="20" width="20" height="2.5" rx="1.25" fill="#CBD5E1" />
  </g>

  <!-- White Front Sheet (Rotated Right) -->
  <g transform="translate(100, 36) rotate(8)">
    <rect x="0" y="0" width="36" height="48" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" />
    <rect x="6" y="9" width="24" height="3" rx="1.5" fill="#0066FF" />
    <rect x="6" y="16" width="20" height="2.5" rx="1.25" fill="#94A3B8" />
    <rect x="6" y="22" width="16" height="2.5" rx="1.25" fill="#CBD5E1" />
    <rect x="6" y="28" width="22" height="2.5" rx="1.25" fill="#E2E8F0" />
  </g>

  <!-- Blue Upload Box / Tray -->
  <g filter="drop-shadow(0 8px 16px rgba(0, 102, 255, 0.25))">
    <rect x="78" y="70" width="64" height="54" rx="14" fill="#0066FF" />
  </g>

  <!-- Upload Arrow Icon inside Blue Box -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow -->
    <path d="M110 82 V99" />
    <path d="M103 89 L110 82 L117 89" />
    <!-- Tray Bottom Line -->
    <path d="M94 105 H126" />
  </g>
</svg>
